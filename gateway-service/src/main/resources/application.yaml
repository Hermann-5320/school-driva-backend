server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # ⚠️ L'ordre compte : la route la plus spécifique d'abord.
            # /api/admin/parametres/** est servi par course-service,
            # le reste de /api/admin/** par auth-service.
            - id: course-admin-parametres
              uri: ${COURSE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/admin/parametres,/api/admin/parametres/**

            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/villes,/api/villes/**,/api/passagers/**,/api/chauffeurs/**,/api/chauffeur/documents/**,/api/campus,/api/campus/**,/api/admin/**

            - id: course-service
              uri: ${COURSE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/courses,/api/courses/**

            - id: paiement-service
              uri: ${PAIEMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/paiements/**

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
